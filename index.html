<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampire Survivors Clone</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
        <h3>Controls</h3>
        <p><strong>Move:</strong> WASD or Arrow Keys</p>
        <p><strong>Attack:</strong> Automatic (targets nearest enemy)</p>
        <p><strong>Ultimate:</strong> E Key</p>
        <p><strong>Dash:</strong> Space Bar</p>
        <p><strong>Debug:</strong> U (toggle), L (instant level up)</p>
        <p><strong>Objective:</strong> Survive and collect spells!</p>
    </div>
</body>
</html>
